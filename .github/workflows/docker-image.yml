name: Docker Image CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Same footprint problem as vllm-gfx1151: the ROCm 7.14 tarball alone
    # is ~16GB extracted, torch is another ~2GB. A stock ubuntu-latest
    # runner doesn't have room for that plus the build cache without
    # reclaiming the preinstalled toolchains we never use.
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
          /usr/share/swift /usr/local/.ghcup
        sudo docker image prune --all --force || true
        df -h /

    - name: Get version
      id: version
      run: echo "tag=$(cat .tags)" >> $GITHUB_OUTPUT

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: DockerHub Login
      uses: docker/login-action@v3
      with:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Github Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # No gha cache: same reasoning as vllm-gfx1151 — the layers worth
    # caching (ROCm tarball, torch install) each exceed the 10GB GHA cache
    # budget on their own.
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ github.repository }}:latest
          ${{ github.repository }}:${{ steps.version.outputs.tag }}
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
